# =============================================================================
# Taswoq Production Nginx Reverse Proxy Configuration
# يتم وضع هذا الملف على خادم Linux VPS في المسار: /etc/nginx/sites-available/taswoq
# ويتم تفعيله عبر: ln -s /etc/nginx/sites-available/taswoq /etc/nginx/sites-enabled/
# =============================================================================

# -----------------------------------------------------------------------------
# تحذير أمني حاسم حول منع تجاوز Cloudflare (Cloudflare Bypass Prevention):
# إن حظر server_name _ ورمز 444 في Nginx يحمي من طلبات HTTP المجردة فقط، لكنه لا
# يكفي وحده لمنع تجاوز Cloudflare إذا اكتشف المهاجم عنوان الـ IP العام للـ VPS.
# لمنع التجاوز جذرياً، يجب حصر منافذ الويب (80 و 443) على مستوى جدار الحماية (UFW)
# على نطاقات خوادم Cloudflare حصراً، مع الإبقاء الصارم على منفذ SSH (المنفذ 22)
# مفتوحاً للإدارة لتفادي انقطاع اتصال المشرف. (راجع تفاصيل الأوامر في دليل النشر).
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# 1. استعادة عنوان الزائر الفعلي خلف Cloudflare عبر وحدة ngx_http_realip_module
# ملاحظة أمنية حاسمة: لا يتم الوثوق بترويسة CF-Connecting-IP إلا إذا كان الاتصال
# قادماً حصرياً من نطاقات خوادم Cloudflare الرسمية؛ وأي اتصال خارجي مباشر يرسل
# هذه الترويسة سيتم تجاهل ترويسته واستخدام IP اتصاله الفعلي لمنع التزوير.
# -----------------------------------------------------------------------------
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# -----------------------------------------------------------------------------
# 2. مناطق الحد من معدل الطلبات (Rate Limiting) مطبقة على IP الزائر الفعلي
# -----------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_orders_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_complaints_limit:10m rate=5r/m;

# -----------------------------------------------------------------------------
# 3. خوادم افتراضية لرفض أي اتصال مباشر بعنوان الـ IP أو بنطاق غير معتمد (Bypass Prevention)
# -----------------------------------------------------------------------------
# أ. رفض اتصالات HTTP المباشرة على المنفذ 80
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # قطع الاتصال فوراً برمز 444 بدون إرسال استجابة لمنع الماسحات والمهاجمين المباشرين
    return 444;
}

# ب. رفض اتصالات HTTPS المباشرة على المنفذ 443
# يتطلب التوجيه ssl_reject_handshake إصدار Nginx 1.19.4 أو أعلى حصراً.
# يجب التحقق من إصدار Nginx الفعلي على الـ VPS عبر: nginx -v
# واختبار سلامة الصياغة دائماً عبر: sudo nginx -t
# في حال كان الإصدار المثبت 1.19.4 فأحدث:
# يقطع التوجيه ssl_reject_handshake on مصافحة TLS على مستوى SNI فوراً
# دون الحاجة لأي شهادة ودون تسريب اسم النطاق.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;

    # الإعداد البديل الإلزامي للإصدارات القديمة (Nginx < 1.19.4):
    # إذا كان الإصدار قديماً وأظهر أمر nginx -t خطأ "unknown directive ssl_reject_handshake":
    # قم بتعطيل السطر أعلاه (# ssl_reject_handshake on;) وفعّل السطور التالية مع شهادة وهمية:
    # ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    # ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    # return 444;
}

# -----------------------------------------------------------------------------
# 4. إعادة توجيه HTTP إلى HTTPS للنطاق المعتمد
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name <نطاقي>; # استبدل بالنطاق الفعلي بعد حجزه وربط Cloudflare

    return 301 https://$host$request_uri;
}

# -----------------------------------------------------------------------------
# 5. الخادم الآمن الرئيسي لتطبيق Taswoq
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <نطاقي>; # استبدل بالنطاق الفعلي

    # مسار شهادات SSL (سواء شهادة Cloudflare Origin CA أو Let's Encrypt)
    ssl_certificate         /etc/ssl/certs/taswoq.crt;
    ssl_certificate_key     /etc/ssl/private/taswoq.key;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # سقف عام لحجم جسم الطلب (Request Body Size)
    client_max_body_size 1m;

    # جذر الملفات العامة الثابتة (معزول تماماً عن كود بايثون وقواعد البيانات)
    root /var/www/taswoq/public;
    index index.html لوحة_تحكم_الإدارة.html;

    # ترويسات الأمان العامة
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # تخديم الملفات الثابتة مباشرة مع التخزين المؤقت (Caching)
    location / {
        try_files $uri $uri/ =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # مسار تسجيل الدخول الموحد المستقل
    location = /login {
        rewrite ^ /login.html last;
    }

    location = /login.html {
        default_type text/html;
        charset utf-8;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files /login.html =404;
    }

    # توجيه لوحة الإدارة العربية المعتمدة
    location = /admin {
        rewrite ^ /لوحة_تحكم_الإدارة.html permanent;
    }

    # تمرير طلبات الواجهة البرمجية (API) العامة إلى خادم بايثون الداخلي
    location /api/ {
        limit_req zone=api_general_limit burst=30 nodelay;
        client_max_body_size 1m;

        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ضبط مهلات الاتصال
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # مسارات تسجيل الدخول: تشديد معدل الطلبات وسقف الحجم 32 كيلوبايت
    # 5 محاولات في الدقيقة كمتوسط مع دفعة مسموحة burst=4 nodelay (إجمالي 5 طلبات فورية متتالية كحد أقصى، ويرفض الطلب السادس 503)
    location = /api/auth/login {
        limit_req zone=api_auth_limit burst=4 nodelay;
        client_max_body_size 32k;

        proxy_pass http://127.0.0.1:8080/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/developer/login {
        limit_req zone=api_auth_limit burst=4 nodelay;
        client_max_body_size 32k;

        proxy_pass http://127.0.0.1:8080/api/auth/developer/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/admin/login {
        limit_req zone=api_auth_limit burst=4 nodelay;
        client_max_body_size 32k;

        proxy_pass http://127.0.0.1:8080/api/auth/admin/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/employee/login {
        limit_req zone=api_auth_limit burst=4 nodelay;
        client_max_body_size 32k;

        proxy_pass http://127.0.0.1:8080/api/auth/employee/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # مسارات إدارة المستخدمين: حماية بسقف 32k
    location ^~ /api/users {
        limit_req zone=api_auth_limit burst=5 nodelay;
        client_max_body_size 32k;

        proxy_pass http://127.0.0.1:8080/api/users;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # مسار إنشاء وتتبع الطلبات: تشديد معدل الطلبات وسقف الحجم 256 كيلوبايت
    location = /api/orders {
        limit_req zone=api_orders_limit burst=10 nodelay;
        client_max_body_size 256k;

        proxy_pass http://127.0.0.1:8080/api/orders;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # مسار الشكاوى: تشديد معدل الطلبات وسقف الحجم 64 كيلوبايت
    location = /api/complaints {
        limit_req zone=api_complaints_limit burst=5 nodelay;
        client_max_body_size 64k;

        proxy_pass http://127.0.0.1:8080/api/complaints;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # الحظر الصارم لأي محاولة لقراءة ملفات الكود أو البيانات أو الأسرار
    location ~* \.(py|sql|json|env|md|log|bak|tmp|git|sh)$ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}
